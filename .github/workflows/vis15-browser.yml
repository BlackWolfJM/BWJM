name: VIS-15 live collapse browser

on:
  pull_request:
    branches: [main]
    paths:
      - apps/playground/src/main.tsx
      - packages/renderer-plotly/src/plotlyRenderer.ts
      - packages/renderer-plotly/__tests__/vis15Collapse.test.ts
      - scripts/vis15-browser.mjs
      - .github/workflows/vis15-browser.yml
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser runner
        run: |
          mkdir -p /tmp/bwjm-browser
          npm install --prefix /tmp/bwjm-browser --no-save --no-package-lock playwright@1.58.2
          /tmp/bwjm-browser/node_modules/.bin/playwright install chromium
      - name: Test VIS-15 in Chromium
        run: node scripts/vis15-browser.mjs
