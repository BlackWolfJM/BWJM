name: VIS-12 graph settings browser

on:
  push:
    branches: [codex/vis-12-apertura-personalizar-grafica]
  pull_request:
    branches: [main]
    paths:
      - apps/playground/src/main.tsx
      - apps/playground/src/graphSettingsSession.ts
      - apps/playground/__tests__/vis12-graph-settings-session.test.ts
      - scripts/vis12-browser.mjs
      - .github/workflows/vis12-browser.yml

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/bwjm-browser
          npm install --prefix /tmp/bwjm-browser --no-save --no-package-lock playwright@1.58.2
          /tmp/bwjm-browser/node_modules/.bin/playwright install chromium
      - name: Verify VIS-12 graph settings in Chromium
        run: node scripts/vis12-browser.mjs
      - name: Save VIS-12 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis12-graph-settings
          path: /tmp/vis12-screens/*.png
          if-no-files-found: ignore
