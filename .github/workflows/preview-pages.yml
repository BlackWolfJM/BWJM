name: Preview BWJM Studio on GitHub Pages

on:
  push:
    branches:
      - feat/scientific-tables-equations-3d-20261108
    paths:
      - '.github/workflows/preview-pages.yml'
      - 'apps/playground/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-bwjm-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout scientific preview branch
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared scientific packages
        run: pnpm --filter "./packages/*" run build
      - name: Build public Studio with repository-relative assets
        env:
          BWJM_BASE_PATH: /BWJM-WEB-/
        run: pnpm --filter @mathmd/playground run build
      - name: Verify Pages index asset paths
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync('apps/playground/dist/index.html', 'utf8');
          const script = html.match(/<script[^>]*src="(\/BWJM-WEB-\/assets\/[^"]+)"/);
          const css = html.match(/<link[^>]*href="(\/BWJM-WEB-\/assets\/[^"]+\.css)"/);
          if (!script || !css) {
            throw new Error('Invalid GitHub Pages base: bundled JavaScript/CSS must use /BWJM-WEB-/assets/.');
          }
          for (const url of [script[1], css[1]]) {
            const filepath = path.join('apps/playground/dist', url.slice('/BWJM-WEB-/'.length));
            if (!fs.existsSync(filepath)) throw new Error('Missing bundled asset: ' + filepath);
          }
          console.log('Pages assets verified:', script[1], css[1]);
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Studio site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/playground/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
