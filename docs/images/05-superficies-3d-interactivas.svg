<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect x="15" y="15" width="870" height="370" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <rect x="15" y="15" width="870" height="50" rx="12" fill="#0f172a" />
  <line x1="15" y1="65" x2="885" y2="65" stroke="#334155" stroke-width="1" />
  <text x="35" y="46" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="0.5">BWJM STUDIO | VISUALIZACION 3D Y ONDAS ARMONICAS ESTACIONARIAS</text>
  <rect x="710" y="30" width="155" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
  <text x="787" y="46" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">MOTOR PLOTLY 3D</text>

  <!-- Left: Formula & Controls -->
  <g transform="translate(35, 85)">
    <rect x="0" y="0" width="360" height="280" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="30" font-size="13" font-weight="700" fill="#f8fafc">ECUACION DE LA SUPERFICIE 3D</text>
    
    <rect x="20" y="45" width="320" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="180" y="75" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="'JetBrains Mono', monospace">
      z(x,y) = A · sin(ω · √(x²+y²)) / √(x²+y²)
    </text>

    <!-- Controls -->
    <text x="20" y="125" font-size="11" font-weight="700" fill="#94a3b8">PARAMETROS EN TIEMPO REAL</text>
    
    <!-- Slider Amplitud -->
    <g transform="translate(20, 140)">
      <text x="0" y="14" font-size="11" font-weight="600" fill="#f8fafc">Amplitud (A): 1.50</text>
      <rect x="0" y="22" width="320" height="6" rx="3" fill="#334155" />
      <rect x="0" y="22" width="160" height="6" rx="3" fill="#0284c7" />
      <circle cx="160" cy="25" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Slider Frecuencia -->
    <g transform="translate(20, 195)">
      <text x="0" y="14" font-size="11" font-weight="600" fill="#f8fafc">Frecuencia (ω): 2.25 rad/s</text>
      <rect x="0" y="22" width="320" height="6" rx="3" fill="#334155" />
      <rect x="0" y="22" width="220" height="6" rx="3" fill="#0284c7" />
      <circle cx="220" cy="25" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    </g>

    <text x="20" y="260" font-size="11" font-weight="600" fill="#38bdf8">Animacion continua: 60 FPS determinista</text>
  </g>

  <!-- Right: 3D Isometric Mesh Representation -->
  <g transform="translate(420, 85)">
    <rect x="0" y="0" width="445" height="280" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
    <text x="222" y="30" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">MALLA TRIDIMENSIONAL CON CONTORNOS DE NIVEL</text>

    <!-- Isometric Surface Waves -->
    <g transform="translate(222, 160)">
      <!-- Wave 1: outermost -->
      <ellipse cx="0" cy="50" rx="180" ry="40" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="3,3" />
      <!-- Wave 2: crest -->
      <ellipse cx="0" cy="30" rx="145" ry="32" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="2" />
      <!-- Wave 3: trough -->
      <ellipse cx="0" cy="10" rx="105" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.8" />
      <!-- Wave 4: inner crest -->
      <ellipse cx="0" cy="-15" rx="70" ry="16" fill="#38bdf8" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2.5" />
      <!-- Central Peak -->
      <ellipse cx="0" cy="-45" rx="30" ry="8" fill="#e0f2fe" stroke="#ffffff" stroke-width="2" />

      <!-- Contour lines vertical guides -->
      <path d="M -180 50 Q -70 -15 0 -45 Q 70 -15 180 50" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 0 90 Q 0 20 0 -45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>

    <text x="222" y="260" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Rotacion orbital 360°, zoom dinamico y aislamiento de capas topologicas
    </text>
  </g>
</svg>

