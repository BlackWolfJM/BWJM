<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" style="background:#0b1120; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <rect x="15" y="15" width="870" height="390" rx="12" fill="#131e33" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <rect x="15" y="15" width="870" height="52" rx="12" fill="#0b1120" />
  <line x1="15" y1="67" x2="885" y2="67" stroke="#334155" stroke-width="1" />
  <text x="35" y="47" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="0.5">BWJM STUDIO | CINEMATICA ESPACIAL Y TRIEDRO DE FRENET-SERRET (3D)</text>
  <rect x="680" y="28" width="185" height="26" rx="13" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
  <text x="772" y="45" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">MODULO CURVE3D &amp; PLOTLY</text>

  <!-- Left Column: Mathematical Formulation & Parameters -->
  <g transform="translate(35, 87)">
    <rect x="0" y="0" width="370" height="300" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
    
    <text x="20" y="26" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">ECUACION DE LA TRAYECTORIA ESPACIAL</text>
    <rect x="20" y="38" width="330" height="42" rx="6" fill="#131e33" stroke="#334155" stroke-width="1" />
    <text x="185" y="64" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="'JetBrains Mono', monospace">
      r(t) = (cos(t), sin(t), t / 3)
    </text>

    <text x="20" y="105" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">INVARIANTES DIFERENCIALES EXACTOS</text>
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="158" height="50" rx="6" fill="#131e33" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" font-size="11" font-weight="600" fill="#64748b">Rapidez |v(t)|:</text>
      <text x="12" y="40" font-size="13" font-weight="700" fill="#38bdf8" font-family="'JetBrains Mono', monospace">√10/3 ≈ 1.054</text>

      <rect x="172" y="0" width="158" height="50" rx="6" fill="#131e33" stroke="#1e293b" stroke-width="1" />
      <text x="184" y="22" font-size="11" font-weight="600" fill="#64748b">Curvatura κ:</text>
      <text x="184" y="40" font-size="13" font-weight="700" fill="#818cf8" font-family="'JetBrains Mono', monospace">9/10 = 0.900</text>
    </g>

    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="158" height="50" rx="6" fill="#131e33" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" font-size="11" font-weight="600" fill="#64748b">Torsion τ:</text>
      <text x="12" y="40" font-size="13" font-weight="700" fill="#ec4899" font-family="'JetBrains Mono', monospace">3/10 = 0.300</text>

      <rect x="172" y="0" width="158" height="50" rx="6" fill="#131e33" stroke="#1e293b" stroke-width="1" />
      <text x="184" y="22" font-size="11" font-weight="600" fill="#64748b">Radio osculador R:</text>
      <text x="184" y="40" font-size="13" font-weight="700" fill="#10b981" font-family="'JetBrains Mono', monospace">10/9 ≈ 1.111</text>
    </g>

    <text x="20" y="250" font-size="11" font-weight="700" fill="#94a3b8">BARRIDO CINEMATICO (TIEMPO t)</text>
    <g transform="translate(20, 260)">
      <rect x="0" y="6" width="330" height="6" rx="3" fill="#334155" />
      <rect x="0" y="6" width="180" height="6" rx="3" fill="#0284c7" />
      <circle cx="180" cy="9" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="24" font-size="10" font-weight="600" fill="#64748b">t = 0.00 s</text>
      <text x="180" y="24" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">t = 3.42 s</text>
      <text x="330" y="24" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">t = 6.28 s</text>
    </g>
  </g>

  <!-- Right Column: 3D Helix & Frenet Frame Projection -->
  <g transform="translate(425, 87)">
    <rect x="0" y="0" width="440" height="300" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
    <text x="220" y="26" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">HELICE 3D CON MARCO MOVIL Y PARTICULA</text>

    <!-- 3D Coordinate Grid & Projection -->
    <g transform="translate(220, 160)">
      <!-- Spatial Axes -->
      <line x1="-150" y1="70" x2="150" y2="-70" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="-150" y1="-50" x2="150" y2="50" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="0" y1="110" x2="0" y2="-110" stroke="#334155" stroke-width="1.5" />
      <text x="10" y="-100" font-size="11" font-weight="700" fill="#64748b">Z</text>
      <text x="155" y="-65" font-size="11" font-weight="700" fill="#64748b">Y</text>
      <text x="155" y="55" font-size="11" font-weight="700" fill="#64748b">X</text>

      <!-- Parametric 3D Helix Path -->
      <path d="M -90,95 C -120,60 -110,-10 -60,-25 C -10,-40 50,10 80,45 C 110,80 120,10 90,-40 C 60,-90 -10,-85 -70,-60"
            fill="none" stroke="url(#curveGrad)" stroke-width="4" stroke-linecap="round" />

      <!-- Active Particle Position -->
      <circle cx="80" cy="45" r="7" fill="#f43f5e" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />

      <!-- Tangent Vector T (Cyan) -->
      <line x1="80" y1="45" x2="140" y2="25" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
      <polygon points="144,24 135,20 137,29" fill="#06b6d4" />
      <text x="148" y="22" font-size="11" font-weight="700" fill="#06b6d4">T (Tangente)</text>

      <!-- Normal Vector N (Purple) -->
      <line x1="80" y1="45" x2="45" y2="5" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
      <polygon points="41,1 45,10 52,6" fill="#a855f7" />
      <text x="18" y="2" font-size="11" font-weight="700" fill="#a855f7">N (Normal)</text>

      <!-- Binormal Vector B (Pink) -->
      <line x1="80" y1="45" x2="95" y2="-10" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
      <polygon points="98,-14 90,-7 98,-4" fill="#ec4899" />
      <text x="105" y="-14" font-size="11" font-weight="700" fill="#ec4899">B (Binormal)</text>

      <!-- Osculating Circle Arc Indicator -->
      <path d="M 50,30 A 35,35 0 0,1 110,60" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
      <text x="95" y="80" font-size="10" font-weight="600" fill="#10b981">Circulo osculador (R = 1/κ)</text>
    </g>

    <!-- Legend -->
    <g transform="translate(20, 272)">
      <circle cx="6" cy="6" r="4" fill="#06b6d4" />
      <text x="16" y="10" font-size="10" font-weight="600" fill="#94a3b8">T: Tangente unitario</text>

      <circle cx="140" cy="6" r="4" fill="#a855f7" />
      <text x="150" y="10" font-size="10" font-weight="600" fill="#94a3b8">N: Normal principal</text>

      <circle cx="270" cy="6" r="4" fill="#ec4899" />
      <text x="280" y="10" font-size="10" font-weight="600" fill="#94a3b8">B: Binormal (T x N)</text>
    </g>
  </g>
</svg>
